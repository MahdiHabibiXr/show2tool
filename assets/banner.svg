<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">Show2Tool</title><desc id="desc">Demonstrate. Parameterize. Verify. A local browser workflow research prototype.</desc>
