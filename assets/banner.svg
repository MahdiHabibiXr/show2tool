<text x="60" y="160" font-size="76" font-weight="700" fill="#f4fafc">Show<tspan fill="#83d6ed">2</tspan>Tool</text>
<text x="64" y="203" font-size="25" fill="#cae2eb">Show a workflow. Check what it learned.</text>
<text x="64" y="242" font-size="17" fill="#a0c3d1">Local capture · Explicit approvals · Evidence before claims</text>
