<g transform="translate(454 292)"><rect width="330" height="74" rx="10" fill="#244c60" stroke="#466c7e"/><text x="20" y="30" font-size="13" fill="#83d6ed" letter-spacing="2">02 / PARAMETERIZE</text><text x="20" y="54" font-size="17" fill="#e5f1f6">Find the changing inputs</text></g>
<path d="M798 329h32m-7-6 7 6-7 6" fill="none" stroke="#83d6ed" stroke-width="2"/>
